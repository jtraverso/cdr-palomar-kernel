name = "plantholt_overfull"
version = "0.1.0"
defaultTargets = ["Balanced", "Plantholt", "OneFactor", "PlantholtChallenge", "PlantholtSolution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "ccjs_overfull"
git = "https://github.com/jtraverso/overfull-critical-graphs"
rev = "b85da9ac66e0fb8b9873a8bea0c057f78c9d186c"

[[lean_lib]]
name = "Balanced"
globs = ["Balanced.+"]

[[lean_lib]]
name = "Plantholt"
globs = ["Plantholt.+"]

[[lean_lib]]
name = "OneFactor"
globs = ["OneFactor.+"]

[[lean_lib]]
name = "PlantholtChallenge"
roots = ["PlantholtChallenge"]

[[lean_lib]]
name = "PlantholtSolution"
roots = ["PlantholtSolution"]
