version: "v0.4"

project:
  name: "Prescribed block types and abundance in bicolored Steiner triple systems"
  description: >-
    Four Lean results for bicolored Steiner triple systems. For each fixed
    number k >= 3 of color classes, sufficiently large compatible labelled
    profiles with positive class and type margins admit exact prescribed
    block-type counts while completing any sufficiently sparse allowed packing.
    Uniformly over such prescribed matrices, the logarithm of the number of
    realizations has optimal leading coefficient 1/6 in n squared times log n.
    For any fixed K, the same exact type matrix has K realizations with distinct
    Pasch counts. For every fixed k >= 4, all sufficiently large admissible
    orders admit a k-bicoloring. The final threshold is ineffective.
  authors: ["Juan Pablo Traverso Gianini"]
  license: "Apache-2.0"
  responsible_maintainers: ["Juan Pablo Traverso Gianini"]

