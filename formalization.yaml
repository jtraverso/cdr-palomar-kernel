version: "v0.4"

project:
  name: "The Colbourn–Dinitz–Rosa conjecture and the exact block-type spectrum"
  description: >-
    A Lean 4 formalization of two results on strictly 3-bicolored Steiner triple
    systems. For every positive triple of class sizes a,b,c, existence is
    equivalent to n=a+b+c being 1 or 3 modulo 6, the identity
    a²+b²+c²-ab-ac-bc=n, and the exclusion of two classes of size 2.
    For every sufficiently large admissible profile, the number of AAC blocks
    is characterized exactly by two explicit arithmetic tests. The first
    result settles the class-size conjecture posed by Colbourn, Dinitz and Rosa
    in 1999; the second applies the typed absorption theorems of Triangle
    decompositions III. Both statements are compared in one shared development.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05B07", "05C15"]

