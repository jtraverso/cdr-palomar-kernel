status:
  scope: >-
    Four compared main endpoints of CDR Paper III only. General boundary
    spectra, all-order exact three-color spectra and numerical universal
    thresholds are outside this submission. Those CDR IV research tasks are
    not copied into this tree. The new packaging requires its own official
    Palomar preflight and review; the earlier published freeze is separately
    source-bound and audited. No new full local reconstruction is claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: manual
    - method: agent
      models: ["Claude", "ChatGPT/Codex"]
      tool_setup: "Human-directed mathematical development, Lean tactics, proof implementation, and editorial assistance."
  notes: >-
    AI assistance is disclosed. The Challenge has four deliberate statement
    holes; the proved Solution may depend only on propext, Classical.choice and
    Quot.sound. No native_decide or extra mathematical axiom is permitted in
    the compared proofs. External analytic and combinatorial results are proved
    dependencies, not hypotheses added to the final statements.

fidelity:
  divergences: >-
    No change to the four main hypotheses or conclusions is intended. The
    source freeze used copied dependency closures; this package requires their
    immutable registered Git repositories and retains only new CDR modules and
    two explicit arithmetic adapters. Import-only CountingCone compatibility
    modules re-export the registered counting proofs without copying them.
    Configuration-only descendants of five registered repositories restrict
    module ownership; their Lean proof sources are byte-identical to the registered
    versions. New CDR source modules use a unique CDRIIILib prefix, preserving
    declaration namespaces and mathematical tokens.
    The Solution uses the registered Siegel
    provider via DSP v2 rather than copying the earlier PNTPort analytic proof.
    The quantitative existence threshold remains ineffective. Local statement
    and axiom checks on the old compiled freeze do not replace verification of
    this repackaged commit by Palomar.

review:
  status: "agent-reviewed"
  reviewers: ["Codex, acting under the author's direction"]
  notes: >-
    The published source freeze passed its internal source-bound reconstruction
    and four endpoint axiom audits, and the manuscripts received external
    feedback. Repackaging is checked separately for dependency provenance and
    statement alignment. These checks are not journal peer review, a new
    specialist audit of analytic inputs, or a completed Palomar review.

