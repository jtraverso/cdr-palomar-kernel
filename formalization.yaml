      by kernel reduction on natural-number tables without changing the theorem.
  - title: "The exact block-type spectrum in the Colbourn–Dinitz–Rosa problem"
    authors: ["Juan Pablo Traverso Gianini"]
    id: "doi:10.5281/zenodo.23987251"
    relationship: background
    location: "https://doi.org/10.5281/zenodo.23987251"
    note: "Accompanying Paper I, Theorem 1; the threshold is existential."
  - title: "Bicoloring Steiner triple systems"
    authors: ["Charles J. Colbourn", "Jeffrey H. Dinitz", "Alexander Rosa"]
    id: "doi:10.37236/1457"
    relationship: background
    note: "1999, Conjecture 2.7 and product Theorem 2.4."
  - title: "Triangle decompositions III: Physical typed absorption and prescribed statistics"
    authors: ["Juan Pablo Traverso Gianini"]
    id: "doi:10.5281/zenodo.23867836"
    relationship: background
    note: "The spectrum proof uses the formalized theorems T and T+."

