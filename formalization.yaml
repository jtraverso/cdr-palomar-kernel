status:
  scope: >-
    Three compared declarations: sufficiency and characterization at every
    order (Paper II), and the exact AAC spectrum for all sufficiently large
    admissible profiles (Paper I). The spectrum threshold is not a numerical
    bound. Further prescriptions from Paper I are present in the library but
    are outside the compared theorem set. Local checks are recorded in
    docs/palomar; no Palomar verification or registration is claimed here.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: manual
    - method: agent
      models: ["Claude", "ChatGPT/Codex"]
      tool_setup: "Lean tactics, mathematical exploration, implementation and editorial assistance"
  notes: >-
    Human-directed mathematical development with AI assistance. Finite tables
    are data: the submitted proofs must verify their laws in Lean's kernel.
    A Python decoder re-encodes the archived tables; correctness does not rely
    on trusting the decoder, since the resulting tables are checked in Lean.
    This public technical copy contains the prepared source without private
    development history. The accompanying article repository is unchanged.

fidelity:
  divergences: >-
    The formal all-order proof verifies 49 finite witness tables (maximum
    order 487) rather than invoking CDR 1999 Theorem 2.6. The spectrum theorem
    preserves its original hypotheses and existential threshold. The public
    preprint freeze remains unchanged; this technical copy changes only the finite
    certificates and submission packaging.

review:
  status: "self-assessed; local verification passed; not submitted to Palomar"
  notes: >-
    The two preprints underwent the internal and external reviews documented
    with their public release. All 49 replacement finite certificates compile
    with kernel reduction. The three selected results and twelve library
    endpoints have been queried from the compiled objects and use only the
    standard three axioms. Twenty statement declarations and definitions match
    the independent Challenge under typed normalization. Unchanged dependency
    objects were reused; this is not a new build of all dependencies. The full
    Palomar mechanical preflight and editorial review have not run. Neither
    journal peer review nor acceptance by Palomar is claimed.

