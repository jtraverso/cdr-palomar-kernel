    relationship: other
    authors: ["Juan Pablo Traverso Gianini"]
    note: >-
      The mathematical results were developed alongside their Lean proofs.
      The two accompanying preprints describe these results. CDR 1999 proposed
      the class-size conjecture and supplied earlier constructions.
  - title: "A proof of the Colbourn–Dinitz–Rosa conjecture"
    authors: ["Juan Pablo Traverso Gianini"]
    id: "doi:10.5281/zenodo.23987256"
    relationship: background
    location: "https://doi.org/10.5281/zenodo.23987256"
    note: >-
